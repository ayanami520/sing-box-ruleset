name: Build rule-sets

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天 UTC 18:00 (北京时间 02:00) 自动重建
    - cron: '0 18 * * *'

permissions:
  contents: write

concurrency:
  group: build-rulesets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 与本机路由器保持一致, 避免 .srs 版本差异
      SING_BOX_VERSION: 1.12.25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install sing-box
        run: |
          set -Eeuo pipefail
          url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          echo "下载: $url"
          curl -fsSL --retry 3 -o sing-box.tar.gz "$url"
          tar -xzf sing-box.tar.gz
          sudo install -m 0755 "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Tool check
        run: |
          set -Eeuo pipefail
          command -v jq && jq --version
          command -v curl

      - name: Build
        run: |
          set -Eeuo pipefail
          sh ./build.sh

      - name: Verify artifacts
        run: |
          set -Eeuo pipefail
          # 真正的规则校验(条目数)在 build.sh 里做; 这里只做结构性与文件级检查:
          #   1) 每个 sources/<name>.txt 都必须有对应的 dist/<name>.srs
          #   2) 不允许出现没有来源的孤立产物
          #   3) 文件不得小于 32B (空 .srs 约 20B)
          fail=0
          for src in sources/*.txt; do
            name=$(basename "$src" .txt)
            f="dist/$name.srs"
            if [ ! -s "$f" ]; then
              echo "::error::缺少产物 $f"
              fail=1
              continue
            fi
            size=$(wc -c < "$f")
            echo "$f  ${size}B"
            if [ "$size" -lt 32 ]; then
              echo "::error::$f 文件异常 (${size}B)"
              fail=1
            fi
          done
          for f in dist/*.srs; do
            [ -e "$f" ] || { echo "::error::没有生成任何 .srs"; exit 1; }
            name=$(basename "$f" .srs)
            if [ ! -f "sources/$name.txt" ]; then
              echo "::error::产物 $f 没有对应的 sources/$name.txt"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Commit results
        run: |
          set -Eeuo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "内容无变化, 跳过提交"
            exit 0
          fi
          git commit -m "chore: 重建规则集 $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
